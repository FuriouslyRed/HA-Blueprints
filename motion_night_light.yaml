blueprint:
  name: Motion-Activated Night Light with Internet Alert & Lux Threshold
  description: >
    Turn on a night light when motion is detected, provided ambient light is at 
    or below a configurable lux threshold (e.g. 0 lx for pitch black). 
    If internet connectivity is lost, overrides normal mode to shine red at 10% brightness. 
    Turns off after motion clears for a set duration.
  domain: automation
  source_url: https://github.com/FuriouslyRed/HA-Blueprints/blob/main/motion_night_light.yaml
  input:
    motion_sensor:
      name: Motion Sensor
      description: The motion or occupancy sensor to monitor.
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: motion
            - domain: binary_sensor
              device_class: occupancy

    light_target:
      name: Light
      description: The light entity or group to control.
      selector:
        target:
          entity:
            domain: light

    internet_sensor:
      name: Internet Connectivity Sensor
      description: Binary sensor tracking your connection (e.g. Ping sensor pinging 1.1.1.1 or 8.8.8.8).
      selector:
        entity:
          filter:
            - domain: binary_sensor

    illuminance_sensor:
      name: Illuminance Sensor (Optional)
      description: Sensor measuring ambient light level (in lux).
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: illuminance

    max_illuminance:
      name: Illuminance Cutoff Threshold
      description: Maximum light level (in lux) allowed for the night light to turn on. Set to 0 for pitch black.
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          step: 1
          unit_of_measurement: "lx"
          mode: box

    brightness_pct:
      name: Normal Brightness Level
      description: Brightness percentage during standard operation.
      default: 20
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    no_motion_wait:
      name: Off Delay
      description: How long to wait after motion clears before turning off the light.
      default:
        minutes: 1
      selector:
        duration: {}

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input motion_sensor
    from: "off"
    to: "on"

variables:
  net_sensor: !input internet_sensor
  lux_sensor: !input illuminance_sensor
  max_lux: !input max_illuminance
  internet_down: "{{ states(net_sensor) in ['off', 'unavailable', 'unknown'] }}"
  # If no illuminance sensor is selected, consider it dark by default
  is_dark: >
    {{ lux_sensor == '' or lux_sensor is none or (states(lux_sensor) | float(0) <= max_lux | float(0)) }}

condition:
  # Abort early if the internet is up and the room is already bright
  - condition: template
    value_template: "{{ internet_down or is_dark }}"

action:
  - choose:
      # OFFLINE ALERT MODE (Precedence)
      - conditions:
          - condition: template
            value_template: "{{ internet_down }}"
        sequence:
          - action: light.turn_on
            target: !input light_target
            data:
              rgb_color: [255, 0, 0]
              brightness_pct: 10

      # NORMAL NIGHT LIGHT MODE
      - conditions:
          - condition: template
            value_template: "{{ not internet_down and is_dark }}"
        sequence:
          - action: light.turn_on
            target: !input light_target
            data:
              brightness_pct: !input brightness_pct

  - wait_for_trigger:
      - platform: state
        entity_id: !input motion_sensor
        from: "on"
        to: "off"

  - delay: !input no_motion_wait

  - action: light.turn_off
    target: !input light_target