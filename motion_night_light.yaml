blueprint:
  name: Motion Night Light
  description: >
    Turn on a night light between sunset and sunrise when motion is detected.
    Runs as a single instance and turns off once motion has stayed clear for the configured duration.
  domain: automation
  source_url: https://github.com/FuriouslyRed/HA-Blueprints/blob/main/motion_night_light.yaml
  input:
    motion_sensor:
      name: Motion Sensor
      description: The motion or occupancy sensor to monitor.
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: motion
            - domain: binary_sensor
              device_class: occupancy

    light_target:
      name: Light
      description: The light entity or group to control.
      selector:
        target:
          entity:
            domain: light

    brightness_pct:
      name: Night Light Brightness Level
      description: Brightness percentage when turned on.
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    no_motion_wait:
      name: Off Delay
      description: How long motion must remain continuously clear before turning off the light.
      default:
        minutes: 1
      selector:
        duration: {}

mode: single
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input motion_sensor
    from: "off"
    to: "on"

condition:
  # Strictly run only when the sun is below the horizon (sunset to sunrise)
  - condition: state
    entity_id: sun.sun
    state: "below_horizon"

action:
  - action: light.turn_on
    target: !input light_target
    data:
      brightness_pct: !input brightness_pct

  # Wait until motion stays continuously off for the configured duration
  - wait_for_trigger:
      - platform: state
        entity_id: !input motion_sensor
        to: "off"
        for: !input no_motion_wait

  - action: light.turn_off
    target: !input light_target