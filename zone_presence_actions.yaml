blueprint:
  name: Zone Presence & Actions
  description: >
    Track individuals or groups entering/leaving a zone with dedicated action slots 
    per person/group, plus optional triggers for first arrival and everyone leaving.
  domain: automation
  source_url: https://github.com/FuriouslyRed/HA-Blueprints/blob/main/zone_presence_actions.yaml
  input:
    monitored_zone:
      name: Monitored Zone
      description: The zone to monitor.
      default: zone.home
      selector:
        entity:
          filter:
            - domain: zone

    debounce_delay:
      name: Debounce Delay
      description: Time to wait to confirm the state change before triggering actions (prevents false triggers from GPS drift).
      default:
        hours: 0
        minutes: 0
        seconds: 0
      selector:
        duration: {}

    # --- GROUP 1 / PRIMARY ---
    group_1_entities:
      name: "Group / Person 1: Tracked Entities"
      description: Select one or more people or device trackers for Group 1.
      selector:
        entity:
          multiple: true
          filter:
            - domain: person
            - domain: device_tracker

    group_1_enter_actions:
      name: "Group / Person 1: Enter Actions"
      description: Actions to run when anyone in Group 1 enters the zone.
      default: []
      selector:
        action: {}

    group_1_leave_actions:
      name: "Group / Person 1: Leave Actions"
      description: Actions to run when anyone in Group 1 leaves the zone.
      default: []
      selector:
        action: {}

    # --- GROUP 2 (OPTIONAL) ---
    group_2_entities:
      name: "Group / Person 2: Tracked Entities (Optional)"
      description: Select one or more people or device trackers for Group 2.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: person
            - domain: device_tracker

    group_2_enter_actions:
      name: "Group / Person 2: Enter Actions"
      description: Actions to run when anyone in Group 2 enters the zone.
      default: []
      selector:
        action: {}

    group_2_leave_actions:
      name: "Group / Person 2: Leave Actions"
      description: Actions to run when anyone in Group 2 leaves the zone.
      default: []
      selector:
        action: {}

    # --- GROUP 3 (OPTIONAL) ---
    group_3_entities:
      name: "Group / Person 3: Tracked Entities (Optional)"
      description: Select one or more people or device trackers for Group 3.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: person
            - domain: device_tracker

    group_3_enter_actions:
      name: "Group / Person 3: Enter Actions"
      description: Actions to run when anyone in Group 3 enters the zone.
      default: []
      selector:
        action: {}

    group_3_leave_actions:
      name: "Group / Person 3: Leave Actions"
      description: Actions to run when anyone in Group 3 leaves the zone.
      default: []
      selector:
        action: {}

    # --- COLLECTIVE / OCCUPANCY STATE ---
    first_arrival_actions:
      name: "Everyone / Occupancy: First to Arrive"
      description: Actions to execute when the zone transitions from 0 to 1+ of all monitored entities.
      default: []
      selector:
        action: {}

    everyone_left_actions:
      name: "Everyone / Occupancy: Last to Leave"
      description: Actions to execute when all monitored entities have left the zone.
      default: []
      selector:
        action: {}

mode: queued
max: 10

trigger:
  - platform: state
    entity_id: !input group_1_entities
    id: group_1
  - platform: state
    entity_id: !input group_2_entities
    id: group_2
  - platform: state
    entity_id: !input group_3_entities
    id: group_3

variables:
  target_zone: !input monitored_zone
  zone_state_name: >
    {{ state_attr(target_zone, 'friendly_name') | lower if target_zone != 'zone.home' else 'home' }}
  trigger_to: "{{ trigger.to_state.state | lower if trigger.to_state is defined else '' }}"
  trigger_from: "{{ trigger.from_state.state | lower if trigger.from_state is defined else '' }}"
  is_enter: "{{ trigger_from != zone_state_name and trigger_to == zone_state_name }}"
  is_leave: "{{ trigger_from == zone_state_name and trigger_to != zone_state_name }}"

  # Combine all defined entities
  g1: !input group_1_entities
  g2: !input group_2_entities
  g3: !input group_3_entities
  all_entities: >
    {{ (g1 if g1 is list else [g1]) + (g2 if g2 is list else [g2]) + (g3 if g3 is list else [g3]) | reject('none') | reject('eq', '') | unique | list }}

condition:
  - condition: template
    value_template: >
      {{ trigger.from_state is defined and trigger.to_state is defined 
         and trigger.from_state.state != trigger.to_state.state 
         and (is_enter or is_leave) }}

action:
  # 1. Debounce pause
  - delay: !input debounce_delay

  # 2. Confirm the entity is STILL in the expected state after the debounce window
  - condition: template
    value_template: >
      {{ (is_enter and (states(trigger.entity_id) | lower == zone_state_name)) or
         (is_leave and (states(trigger.entity_id) | lower != zone_state_name)) }}

  # 3. Recalculate present count post-delay so other arrivals/departures in the window are accurate
  - variables:
      current_present_count: >
        {{ expand(all_entities) | selectattr('state', 'match', zone_state_name, ignorecase=True) | list | count }}

  # 4. First to Arrive Check
  - if:
      - condition: template
        value_template: "{{ is_enter and current_present_count == 1 }}"
    then: !input first_arrival_actions

  # 5. Group 1 Actions
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'group_1' and is_enter }}"
    then: !input group_1_enter_actions
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'group_1' and is_leave }}"
    then: !input group_1_leave_actions

  # 6. Group 2 Actions
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'group_2' and is_enter }}"
    then: !input group_2_enter_actions
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'group_2' and is_leave }}"
    then: !input group_2_leave_actions

  # 7. Group 3 Actions
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'group_3' and is_enter }}"
    then: !input group_3_enter_actions
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'group_3' and is_leave }}"
    then: !input group_3_leave_actions

  # 8. Last to Leave / Everyone Left Check
  - if:
      - condition: template
        value_template: "{{ is_leave and current_present_count == 0 }}"
    then: !input everyone_left_actions
